<!--
// 김'S AI — 서버+화면 통합 파일. 실행: node gims-ai.html (Node 18+) / 브라우저로 열면 화면만 표시됨
const http = require('http'), fs = require('fs'), path = require('path'), crypto = require('crypto');
const { Readable } = require('stream');

// 이 파일 아래쪽의 HTML 문서를 화면으로 사용합니다.
const SELF = fs.readFileSync(__filename, 'utf8');
const PAGE = SELF.slice(SELF.indexOf('<!doc' + 'type html>'), SELF.lastIndexOf('</ht' + 'ml>') + 7);
const PORT = process.env.PORT || 3000;
const ADMIN_IPS = (process.env.ADMIN_IPS || '211.233.75.204').split(',').map(s => s.trim()).filter(Boolean); // 관리자(화이트리스트) IP
const DAILY_LIMIT = Number(process.env.DAILY_LIMIT) || 20;      // 관리자 외 하루 질문 수 (한국시간 자정 초기화)
const TRUST_PROXY = process.env.TRUST_PROXY === '1';            // nginx 등 프록시 뒤에서만 1
const BASE = process.env.GEMINI_BASE || 'https://generativelanguage.googleapis.com';
const DATA = process.env.DATA_DIR || path.join(__dirname, 'data'), ROOMS = path.join(DATA, 'rooms');
fs.mkdirSync(ROOMS, { recursive: true });

// ---------- 저장소 (메모리 + 파일) ----------
const rd = (f, d) => { try { return JSON.parse(fs.readFileSync(f, 'utf8')); } catch { return d; } };
const wr = (f, o) => { const t = f + '.tmp'; fs.writeFileSync(t, JSON.stringify(o), { mode: 0o600 }); fs.renameSync(t, f); };
const F = { cfg: path.join(DATA, 'config.json'), users: path.join(DATA, 'users.json'), sess: path.join(DATA, 'sessions.json'), use: path.join(DATA, 'usage.json') };
const cfg = rd(F.cfg, {}), users = rd(F.users, {}), sess = rd(F.sess, {});
let usage = rd(F.use, { day: '', n: {} });
const today = () => new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
const cnt = k => { if (usage.day !== today()) usage = { day: today(), n: {} }; return usage.n[k] || 0; };
const bump = (k, d) => { cnt(k); usage.n[k] = Math.max(0, (usage.n[k] || 0) + d); wr(F.use, usage); };

// ---------- 유틸 ----------
const ip = req => (TRUST_PROXY && req.headers['x-forwarded-for'] ? req.headers['x-forwarded-for'].split(',').pop().trim() : req.socket.remoteAddress || '').replace(/^::ffff:/, '');
const isAdmin = req => ADMIN_IPS.includes(ip(req));
const send = (res, code, obj, h = {}) => { res.writeHead(code, { 'Content-Type': 'application/json; charset=utf-8', 'Cache-Control': 'no-store', ...h }); res.end(JSON.stringify(obj)); };
const fail = (res, code, message, h) => send(res, code, { error: { message } }, h);
const body = req => new Promise((ok, no) => {
  let b = ''; req.on('data', c => { b += c; if (b.length > 10e6) { no(new Error('요청이 너무 큽니다.')); req.destroy(); } });
  req.on('end', () => { try { ok(JSON.parse(b || '{}')); } catch { no(new Error('잘못된 JSON입니다.')); } });
});
const sha = s => crypto.createHash('sha256').update(s).digest('hex');
const hashPw = (pw, salt) => crypto.scryptSync(pw, salt, 64).toString('hex');
const cookie = req => Object.fromEntries((req.headers.cookie || '').split(';').map(s => s.trim().split('=')).filter(p => p[0]));
const auth = req => {
  if (isAdmin(req)) return { user: 'admin', admin: true };
  const t = cookie(req).sid, s = t && sess[sha(t)];
  return s && s.exp > Date.now() ? { user: s.user, admin: false } : null;
};
const usedOf = (a, req) => a.admin ? 0 : Math.max(cnt('u:' + a.user), cnt('ip:' + ip(req)));
const fails = {};

http.createServer(async (req, res) => {
  const url = new URL(req.url, 'http://x'), p = url.pathname, m = req.method;
  try {
    if (m === 'GET' && (p === '/' || p === '/index.html')) {
      res.writeHead(200, { 'Content-Type': 'text/html; charset=utf-8', 'Cache-Control': 'no-store' });
      return res.end(PAGE);
    }
    const a = auth(req);

    if (p === '/api/me' && m === 'GET') {
      if (!a) return send(res, 200, { user: null });
      return send(res, 200, { user: a.user, admin: a.admin, limit: DAILY_LIMIT, used: usedOf(a, req), hasKey: !!cfg.apiKey });
    }
    if ((p === '/api/register' || p === '/api/login') && m === 'POST') {
      const I = ip(req), f = fails[I] || (fails[I] = { n: 0, t: Date.now() });
      if (Date.now() - f.t > 600e3) { f.n = 0; f.t = Date.now(); }
      if (f.n >= 10) return fail(res, 429, '시도가 너무 많습니다. 10분 뒤에 다시 시도하세요.');
      const { username, password } = await body(req), name = String(username || '').trim().toLowerCase();
      if (!/^[a-z0-9_가-힣]{2,20}$/.test(name)) return fail(res, 400, '아이디는 2~20자의 한글·영문·숫자·_ 만 쓸 수 있습니다.');
      if (typeof password !== 'string' || password.length < 6 || password.length > 100) return fail(res, 400, '비밀번호는 6자 이상이어야 합니다.');
      if (p === '/api/register') {
        if (name === 'admin' || name === '관리자' || users[name]) return fail(res, 409, '이미 사용 중인 아이디입니다.');
        if (cnt('reg:' + I) >= 10) return fail(res, 429, '오늘 가입 가능 횟수를 초과했습니다.');
        const salt = crypto.randomBytes(16).toString('hex');
        users[name] = { salt, hash: hashPw(password, salt) }; wr(F.users, users); bump('reg:' + I, 1);
      } else {
        const u = users[name], ok = u && crypto.timingSafeEqual(Buffer.from(hashPw(password, u.salt), 'hex'), Buffer.from(u.hash, 'hex'));
        if (!ok) { f.n++; return fail(res, 401, '아이디 또는 비밀번호가 올바르지 않습니다.'); }
      }
      const tok = crypto.randomBytes(32).toString('hex');
      for (const k of Object.keys(sess)) if (sess[k].exp < Date.now()) delete sess[k];
      sess[sha(tok)] = { user: name, exp: Date.now() + 30 * 864e5 }; wr(F.sess, sess);
      const secure = req.socket.encrypted || (TRUST_PROXY && req.headers['x-forwarded-proto'] === 'https') ? '; Secure' : '';
      return send(res, 200, { ok: true }, { 'Set-Cookie': `sid=${tok}; HttpOnly; SameSite=Lax; Path=/; Max-Age=${30 * 86400}${secure}` });
    }
    if (p === '/api/logout' && m === 'POST') {
      const t = cookie(req).sid; if (t) { delete sess[sha(t)]; wr(F.sess, sess); }
      return send(res, 200, { ok: true }, { 'Set-Cookie': 'sid=; HttpOnly; Path=/; Max-Age=0' });
    }
    if (!a) return fail(res, 401, '로그인이 필요합니다.');

    // ----- 관리자 전용 API 키 -----
    if (p === '/api/config') {
      if (m === 'GET') return send(res, 200, a.admin ? { hasKey: !!cfg.apiKey, key: cfg.apiKey || '' } : { hasKey: !!cfg.apiKey });
      if (!a.admin) return fail(res, 403, 'API 키는 관리자만 변경할 수 있습니다.');
      if (m === 'PUT') {
        const { apiKey } = await body(req);
        if (typeof apiKey !== 'string' || !/^\S{20,}$/.test(apiKey.trim())) return fail(res, 400, '올바른 API 키 형식이 아닙니다.');
        cfg.apiKey = apiKey.trim(); wr(F.cfg, cfg); return send(res, 200, { ok: true });
      }
      if (m === 'DELETE') { cfg.apiKey = ''; wr(F.cfg, cfg); return send(res, 200, { ok: true }); }
    }

    // ----- 계정별 채팅방 (기기 간 공유) -----
    if (p === '/api/rooms') {
      const file = path.join(ROOMS, a.user + '.json'), d = rd(file, { rev: 0, rooms: [], tomb: {} });
      if (m === 'GET') return url.searchParams.get('rev') === String(d.rev) ? send(res, 200, { rev: d.rev, same: true }) : send(res, 200, { rev: d.rev, rooms: d.rooms });
      if (m === 'PUT') {
        const { rooms = [], deleted = [] } = await body(req);
        if (!Array.isArray(rooms) || rooms.length > 300 || !Array.isArray(deleted)) return fail(res, 400, '잘못된 요청입니다.');
        const map = new Map(d.rooms.map(r => [r.id, r]));
        for (const id of deleted) { map.delete(id); d.tomb[id] = Date.now(); }
        for (const r of rooms) {
          if (!r || typeof r.id !== 'string' || !Array.isArray(r.messages) || d.tomb[r.id]) continue;
          const old = map.get(r.id); if (!old || (r.updatedAt || 0) >= (old.updatedAt || 0)) map.set(r.id, r);
        }
        d.rooms = [...map.values()].sort((x, y) => (y.updatedAt || 0) - (x.updatedAt || 0)); d.rev++;
        wr(file, d); return send(res, 200, { rev: d.rev, rooms: d.rooms });
      }
    }

    // ----- 채팅 (모든 기기가 관리자가 등록한 키를 사용) -----
    if (p === '/api/chat' && m === 'POST') {
      if (!cfg.apiKey) return fail(res, 503, '관리자가 아직 API 키를 등록하지 않았습니다.');
      const used = usedOf(a, req), H = n => ({ 'X-Used': String(n) });
      if (!a.admin && used >= DAILY_LIMIT) return fail(res, 429, `오늘 질문 한도(${DAILY_LIMIT}회)를 모두 사용했습니다. 내일 다시 이용해 주세요.`, H(used));
      const { model, contents, temperature, noThink } = await body(req);
      if (!/^[\w.\-]+$/.test(model || '') || !Array.isArray(contents) || !contents.length || contents.length > 60) return fail(res, 400, '잘못된 요청입니다.');
      const gen = { temperature: Math.min(2, Math.max(0, Number(temperature) || 0.7)) };
      if (noThink) gen.thinkingConfig = { thinkingBudget: 0 };
      if (!a.admin) { bump('u:' + a.user, 1); bump('ip:' + ip(req), 1); }
      const refund = () => { if (!a.admin) { bump('u:' + a.user, -1); bump('ip:' + ip(req), -1); } };
      const ac = new AbortController(); res.on('close', () => ac.abort());
      let up;
      try {
        up = await fetch(`${BASE}/v1beta/models/${model}:streamGenerateContent?alt=sse`, {
          method: 'POST', signal: ac.signal, headers: { 'Content-Type': 'application/json', 'x-goog-api-key': cfg.apiKey },
          body: JSON.stringify({ contents, generationConfig: gen })
        });
      } catch (e) { refund(); return fail(res, 502, 'Gemini에 연결하지 못했습니다.', H(usedOf(a, req))); }
      if (!up.ok) { refund(); res.writeHead(up.status, { 'Content-Type': 'application/json; charset=utf-8', ...H(usedOf(a, req)) }); return res.end(await up.text()); }
      res.writeHead(200, { 'Content-Type': 'text/event-stream; charset=utf-8', 'Cache-Control': 'no-cache', 'X-Accel-Buffering': 'no', ...H(usedOf(a, req)) });
      res.flushHeaders();
      return Readable.fromWeb(up.body).on('error', () => res.end()).pipe(res);
    }
    fail(res, 404, 'Not found');
  } catch (err) { if (!res.headersSent) fail(res, 500, err.message || '서버 오류'); else res.end(); }
}).listen(PORT, () => console.log(`김'S AI → http://localhost:${PORT}  (관리자 IP: ${ADMIN_IPS.join(', ')}, 일일 한도: ${DAILY_LIMIT})`));

.preview-editor{height:32%;min-height:110px;resize:vertical;width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:12px;font:12px/1.5 ui-monospace,Consolas,monospace;background:var(--bg);outline:0}
.preview-frame-wrap{flex:1;min-height:0;padding:10px;background:var(--side)}
#previewFrame{width:100%;height:100%;border:1px solid var(--line);border-radius:12px;background:#fff}
#scrim{display:none}
@keyframes spin{to{--a:360deg}}
@keyframes flow{to{background-position:-250% 0}}
@keyframes drift{from{transform:translateX(-4%) scale(.96)}to{transform:translateX(4%) scale(1.06)}}
@media(max-width:900px){.preview-pane.open{position:absolute;inset:0;z-index:10;flex-basis:auto;min-width:0;border:0}}
@media(max-width:760px){
 aside{position:fixed;inset:0 auto 0 0;width:282px;z-index:25;transform:translateX(-100%);transition:transform .22s}
 aside.open{transform:none}aside.open~#scrim{display:block;position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.4)}
 .topbar{display:flex}.room-tools{opacity:.8}.row2{grid-template-columns:1fr}
 #chat{padding:16px 14px}.composer-wrap{padding:6px 12px 12px}.hint{display:none}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}

.loading .app-layout{visibility:hidden}
#auth{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;place-items:center;padding:20px}
.auth-card{width:min(380px,100%);text-align:center;isolation:isolate}
.auth-card p{color:var(--muted);margin:12px 0 22px}
#authTabs{display:grid;grid-template-columns:1fr 1fr;background:var(--hover);border-radius:12px;padding:4px;margin-bottom:14px}
#authTabs button{padding:8px;border-radius:9px;font-weight:600;color:var(--muted)}
#authTabs button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.12)}
#authForm{display:flex;flex-direction:column;gap:10px;text-align:left}#authForm input{padding:12px 14px}
.go-wrap{position:relative;isolation:isolate;margin-top:6px}
.go-wrap::before{content:"";position:absolute;inset:-3px;border-radius:15px;background:conic-gradient(from var(--a),var(--aura));filter:blur(9px);opacity:.75;z-index:-1;animation:spin 4s linear infinite}
#authGo{width:100%;padding:12px}
.userbox{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-top:1px solid var(--line);margin-top:4px}
.ub-main{display:flex;flex-direction:column;min-width:0;line-height:1.35}.ub-main b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ub-main span{font-size:12px;color:var(--muted)}
.ghost-sm{font-size:12px;padding:5px 10px;border:1px solid var(--line);border-radius:8px}.ghost-sm:hover{background:var(--hover)}
</style>
</head>
<body class="loading">
<div class="app-layout">
<aside id="side">
  <div class="brand"><span class="brand-mark">K</span> 김'S AI</div>
  <button id="createRoom" class="new">＋ 새 채팅</button>
  <div class="side-title">채팅 기록</div>
  <div id="roomList"></div>
  <div class="userbox"><div class="ub-main"><b id="userName"></b><span id="userQuota"></span></div><button id="logout" class="ghost-sm">로그아웃</button></div>
  <button id="settingsToggle" class="foot-btn">⚙ 설정</button>
</aside>
<div id="scrim"></div>
<main>
  <div class="topbar"><button id="menu" class="icon" aria-label="메뉴">☰</button><button id="newChat" class="icon" aria-label="새 채팅">＋</button></div>
  <div id="chat" aria-live="polite"></div>
  <div class="composer-wrap">
    <div class="composer">
      <textarea id="prompt" rows="1" placeholder="무엇이든 물어보세요" aria-label="메시지 입력"></textarea>
      <button id="send" class="send" aria-label="전송"><svg class="ic-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg><svg class="ic-stop" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg></button>
    </div>
    <div class="hint">Enter 전송 · Shift+Enter 줄바꿈</div>
  </div>
</main>
<section class="preview-pane" id="previewPane" aria-label="코드 프리뷰">
  <div class="preview-top">
    <div class="preview-title">코드 프리뷰</div>
    <div class="preview-controls"><button id="runPreview">▶ 실행</button><button id="closePreview" aria-label="프리뷰 닫기">닫기 ✕</button></div>
  </div>
  <textarea id="previewEditor" class="preview-editor" spellcheck="false" aria-label="프리뷰 코드" placeholder="HTML 코드를 여기에 입력하세요."></textarea>
  <div class="preview-frame-wrap"><iframe id="previewFrame" title="실행 결과" sandbox="allow-scripts allow-forms allow-modals"></iframe></div>
</section>
</div>
<div id="settings" role="dialog" aria-modal="true" aria-labelledby="st">
  <div class="settings-inner">
    <div class="modal-head"><h2 id="st">설정</h2><button id="closeSettings" class="icon" aria-label="닫기">✕</button></div>
    <div class="field" id="keyField"><label for="apiKey">Google Gemini API 키</label><input id="apiKey" type="text" autocomplete="off" spellcheck="false" placeholder="Gemini API 키를 입력하세요"></div>
    <div class="row2">
      <div class="field"><label for="model">모델</label><select id="model"><option value="gemini-2.5-flash-lite">gemini-2.5-flash-lite (가장 빠름)</option><option value="gemini-flash-latest">gemini-flash-latest</option><option value="gemini-2.5-flash">gemini-2.5-flash</option><option value="gemini-2.5-pro">gemini-2.5-pro</option></select></div>
      <div class="field"><label for="temperature">창의성</label><select id="temperature"><option value="0.3">낮음</option><option value="0.7" selected>보통</option><option value="1">높음</option></select></div>
    </div>
    <div class="setting-actions" id="keyActions"><button id="saveKey" class="primary">키 저장</button><button id="forgetKey" class="ghost">저장된 키 삭제</button></div>
    <span id="keyStatus" class="status"></span>
    <p class="notice" id="adminNote" style="display:none">API 키는 관리자만 변경할 수 있습니다. 모든 기기는 관리자가 등록한 키로 연결됩니다.</p>
  </div>
</div>
<div id="auth"><div class="auth-card">
  <div class="aura-wrap"><h1 class="aura-title">김'S AI</h1></div>
  <p>로그인하면 어느 기기에서든 대화가 이어집니다.</p>
  <div id="authTabs"><button data-mode="login" class="on" type="button">로그인</button><button data-mode="register" type="button">가입</button></div>
  <form id="authForm">
    <input id="authUser" autocomplete="username" placeholder="아이디" maxlength="20" required>
    <input id="authPass" type="password" autocomplete="current-password" placeholder="비밀번호 (6자 이상)" required>
    <div class="go-wrap"><button id="authGo" class="primary">로그인</button></div>
    <div id="authErr" class="status error"></div>
  </form>
</div></div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const KEY_STORE = 'gemini_chat_api_key_v1';
  const MODEL_STORE = 'gemini_chat_model_v1';
  let history = [];
  let busy = false; const noThink = new Set(); let abortCtl = null, stopped = false;
  const ROOMS_STORE = 'gims_ai_rooms_v1';
  let rooms = [];
  let currentRoomId = null;
  try { rooms = JSON.parse(localStorage.getItem(ROOMS_STORE) || '[]'); } catch (_) { rooms = []; }
  if (!Array.isArray(rooms)) rooms = [];
  if (!rooms.length) rooms = [{ id: makeId(), title: '새 대화', messages: [], updatedAt: Date.now() }];
  currentRoomId = rooms[0].id;


  const NO_SERVER = location.protocol === 'file:' ? '파일을 직접 열어서 서버에 연결할 수 없습니다. 서버를 실행(node gims-ai.html)한 뒤 http://서버주소:3000 으로 접속하세요.' : '서버에 연결할 수 없습니다. 서버가 실행 중인지, 주소와 포트가 맞는지 확인하세요.';
  let me = null, rev = 0, saveTimer = 0, rdirty = false, pollTimer = 0, authMode = 'login';
  const deletedIds = new Set();
  const storedModel = localStorage.getItem(MODEL_STORE);
  if (storedModel && [...$('model').options].some(o => o.value === storedModel)) $('model').value = storedModel;
  const toggleSettings = open => $('settings').classList.toggle('open', open);
  async function api(method, url, data) {
    let r;
    try { r = await fetch(url, { method, headers: data ? { 'Content-Type': 'application/json' } : {}, body: data && JSON.stringify(data) }); }
    catch (_) { throw new Error(NO_SERVER); }
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw Object.assign(new Error(d?.error?.message || 'HTTP ' + r.status), { status: r.status });
    return d;
  }
  function renderMe() {
    document.body.classList.remove('loading');
    const on = !!me?.user;
    $('auth').style.display = on ? 'none' : 'grid';
    if (!on) return;
    $('userName').textContent = me.admin ? '관리자' : me.user;
    $('userQuota').textContent = me.admin ? '질문 무제한' : '오늘 ' + Math.max(0, me.limit - me.used) + ' / ' + me.limit + '회 남음';
    $('logout').style.display = me.admin ? 'none' : '';
    $('keyField').style.display = $('keyActions').style.display = me.admin ? '' : 'none';
    $('adminNote').style.display = me.admin ? 'none' : '';
  }
  async function loadConfig() {
    if (!me?.admin) return;
    try {
      const c = await api('GET', '/api/config');
      $('apiKey').value = c.key || '';
      setStatus(c.key ? '서버에 API 키가 저장되어 있습니다. 모든 기기가 이 키로 연결됩니다.' : 'API 키를 입력하고 저장하세요.');
      if (!c.key) toggleSettings(true);
    } catch (e) { setStatus(e.message, true); }
  }
  $('settingsToggle').addEventListener('click', () => { $('side').classList.remove('open'); toggleSettings(true); loadConfig(); });
  $('closeSettings').addEventListener('click', () => toggleSettings(false));
  $('settings').addEventListener('click', e => { if (e.target === $('settings')) toggleSettings(false); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') toggleSettings(false); });
  $('saveKey').addEventListener('click', async () => {
    const key = $('apiKey').value.trim();
    if (!key) { setStatus('API 키를 입력하세요.', true); return; }
    try { await api('PUT', '/api/config', { apiKey: key }); await loadConfig(); toggleSettings(false); }
    catch (e) { setStatus('저장 실패: ' + e.message, true); }
  });
  $('forgetKey').addEventListener('click', async () => {
    if (!confirm('서버에 저장된 API 키를 삭제할까요? 모든 기기에서 질문이 중단됩니다.')) return;
    try { await api('DELETE', '/api/config'); await loadConfig(); } catch (e) { setStatus('삭제 실패: ' + e.message, true); }
  });
  // 로그인 / 가입 / 로그아웃
  $('authTabs').addEventListener('click', e => {
    const b = e.target.closest('[data-mode]'); if (!b) return;
    authMode = b.dataset.mode;
    document.querySelectorAll('#authTabs button').forEach(x => x.classList.toggle('on', x === b));
    $('authGo').textContent = authMode === 'login' ? '로그인' : '가입하고 시작';
    $('authPass').autocomplete = authMode === 'login' ? 'current-password' : 'new-password';
    $('authErr').textContent = '';
  });
  $('authForm').addEventListener('submit', async e => {
    e.preventDefault(); $('authErr').textContent = ''; $('authGo').disabled = true;
    try {
      await api('POST', '/api/' + (authMode === 'login' ? 'login' : 'register'), { username: $('authUser').value.trim(), password: $('authPass').value });
      $('authPass').value = ''; await boot();
    } catch (err) { $('authErr').textContent = err.message; }
    finally { $('authGo').disabled = false; }
  });
  $('logout').addEventListener('click', () => { api('POST', '/api/logout').catch(() => {}).finally(() => location.reload()); });
  // 계정 데이터(채팅방) 서버 동기화
  function applyRooms(list, forceLoad) {
    const prevId = currentRoomId, prevLen = currentRoom()?.messages.length;
    rooms = list.length ? list : [{ id: makeId(), title: '새 대화', messages: [], updatedAt: Date.now() }];
    if (!rooms.some(r => r.id === prevId)) currentRoomId = rooms[0].id;
    renderRoomList();
    if (forceLoad || currentRoomId !== prevId || currentRoom().messages.length !== prevLen) loadRoom(currentRoomId);
  }
  async function pullRooms(first) {
    const d = await api('GET', '/api/rooms?rev=' + (first ? -1 : rev));
    if (d.same) return;
    rev = d.rev; let list = d.rooms || [], migrated = false;
    if (first && !list.length && !localStorage.getItem('gims_migrated')) {
      try { const old = JSON.parse(localStorage.getItem(ROOMS_STORE) || '[]'); if (Array.isArray(old) && old.some(r => r.messages?.length)) { list = old; migrated = true; } } catch (_) {}
    }
    if (first) localStorage.setItem('gims_migrated', '1');
    applyRooms(list, first);
    if (migrated) saveRooms();
  }
  async function flushRooms() {
    if (!me?.user) return;
    const del = [...deletedIds]; rdirty = false;
    try {
      const d = await api('PUT', '/api/rooms', { rooms, deleted: del });
      rev = d.rev; del.forEach(x => deletedIds.delete(x));
      if (!busy && !rdirty) applyRooms(d.rooms);
    } catch (e) { rdirty = true; if (e.status === 401) location.reload(); }
  }
  function startPolling() {
    if (pollTimer) return;
    pollTimer = setInterval(async () => {
      if (busy || rdirty || document.hidden || !me?.user) return;
      try { await pullRooms(false); } catch (e) { if (e.status === 401) location.reload(); }
    }, 5000);
  }
  async function boot() {
    try { me = await api('GET', '/api/me'); } catch (e) { me = { user: null }; $('authErr').textContent = e.message; }
    renderMe();
    if (!me.user) return;
    try { await pullRooms(true); } catch (_) {}
    if (me.admin) loadConfig();
    startPolling();
  }
  $('model').addEventListener('change', () => localStorage.setItem(MODEL_STORE, $('model').value));
  $('newChat').addEventListener('click', createRoom);
  $('createRoom').addEventListener('click', () => { createRoom(); $('side').classList.remove('open'); });
  $('menu').addEventListener('click', () => $('side').classList.toggle('open'));
  $('scrim').addEventListener('click', () => $('side').classList.remove('open'));
  $('roomList').addEventListener('click', e => { if (e.target.closest('.room-name')) $('side').classList.remove('open'); });
  $('prompt').addEventListener('input', () => $('send').classList.toggle('ready', !!$('prompt').value.trim()));
  $('chat').addEventListener('click', e => { const c = e.target.closest('.chip'); if (c && !busy) { $('prompt').value = c.dataset.p; sendMessage(); } });
  function welcomeHTML() {
    const chip = (t, p) => '<button class="chip" data-p="' + p + '">' + t + '</button>';
    return '<div class="welcome" id="welcome"><div class="aura-wrap"><h1 class="aura-title">무엇이든 물어보세요</h1></div><p>코드, 글쓰기, 아이디어까지 편하게 대화해 보세요.</p><div class="chips">' +
      chip('웹페이지 만들어줘', '간단한 할 일 목록 웹페이지를 HTML 하나로 만들어줘') +
      chip('쉽게 설명해줘', 'API와 서버의 차이를 초보자에게 설명해줘') +
      chip('이메일 써줘', '정중한 일정 변경 요청 이메일 초안을 써줘') + '</div></div>';
  }
  function stopReply() { stopped = true; abortCtl?.abort(); }
  $('send').addEventListener('click', () => busy ? stopReply() : sendMessage());
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && busy && !$('settings').classList.contains('open')) stopReply(); });
  $('prompt').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  $('prompt').addEventListener('input', () => {
    const el = $('prompt'); el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 180) + 'px';
  });


  function makeId() { return 'room_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function saveRooms() { rdirty = true; clearTimeout(saveTimer); saveTimer = setTimeout(flushRooms, 500); }
  function currentRoom() { return rooms.find(r => r.id === currentRoomId); }
  function createRoom() {
    if (busy) return;
    const room = { id: makeId(), title: '새 대화', messages: [], updatedAt: Date.now() };
    if ($('model').value) room.model = $('model').value;
    rooms.unshift(room); currentRoomId = room.id; saveRooms(); renderRoomList(); loadRoom(room.id); $('prompt').focus();
  }
  function renderRoomList() {
    const list = $('roomList'); list.innerHTML = '';
    rooms.slice().sort((a,b) => b.updatedAt - a.updatedAt).forEach(room => {
      const item = document.createElement('div');
      item.className = 'room-item' + (room.id === currentRoomId ? ' active' : '');
      const name = document.createElement('button'); name.className = 'room-name room-tool'; name.title = room.title; name.textContent = room.title || '새 대화';
      name.addEventListener('click', () => { if (!busy) { currentRoomId = room.id; renderRoomList(); loadRoom(room.id); } });
      const tools = document.createElement('div'); tools.className = 'room-tools';
      const rename = document.createElement('button'); rename.className = 'room-tool'; rename.textContent = '✎'; rename.title = '이름 변경';
      rename.addEventListener('click', e => { e.stopPropagation(); if (busy) return; const value = prompt('채팅방 이름을 입력하세요', room.title); if (value && value.trim()) { room.title = value.trim().slice(0,80); room.updatedAt = Date.now(); saveRooms(); renderRoomList(); } });
      const remove = document.createElement('button'); remove.className = 'room-tool'; remove.textContent = '×'; remove.title = '채팅방 삭제';
      remove.addEventListener('click', e => { e.stopPropagation(); if (busy) return; if (!confirm('이 채팅방을 삭제할까요?')) return; deletedIds.add(room.id); rooms = rooms.filter(r => r.id !== room.id); if (!rooms.length) rooms = [{id:makeId(),title:'새 대화',messages:[],updatedAt:Date.now()}]; if (currentRoomId === room.id) currentRoomId = rooms[0].id; saveRooms(); renderRoomList(); loadRoom(currentRoomId); });
      tools.append(rename, remove); item.append(name, tools); list.appendChild(item);
    });
  }
  function loadRoom(id) {
    const room = rooms.find(r => r.id === id); if (!room) return;
    currentRoomId = id;
    if (room.model && [...$('model').options].some(o => o.value === room.model)) $('model').value = room.model;
    history = [];
    $('chat').innerHTML = '';
    if (!room.messages.length) {
      $('chat').innerHTML = welcomeHTML();
    } else {
      room.messages.forEach(m => {
        addMessage(m.role, m.text);
        if (m.role === 'user') history.push({role:'user',parts:[{text:m.text}]});
        else if (m.role === 'assistant') history.push({role:'model',parts:[{text:m.text}]});
      });
    }
    $('chat').scrollTop = $('chat').scrollHeight;
  }
  function saveRoomMessage(role, text) {
    const room = currentRoom(); if (!room) return;
    room.messages.push({role, text});
    room.updatedAt = Date.now();
    if (role === 'user' && room.messages.length === 1 && room.title === '새 대화') room.title = text.slice(0, 32) || '새 대화';
    saveRooms(); renderRoomList();
  }

  // Lightweight Markdown renderer: supports inline `code`, fenced ```code```,
  // headings, lists, blockquotes, tables, bold and italic. HTML is escaped first.
  function renderMarkdown(source) {
    const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    const codeBlocks = [];
    let src = source.replace(/\r\n?/g, '\n').replace(/```([^\n`]*)\n([\s\S]*?)```/g, (_, lang, code) => {
      const label = lang.trim() || 'code';
      const cleanCode = code.replace(/\n$/, '');
      const html = '<div class="code-card"><div class="code-toolbar"><span>' + esc(label) + '</span><div class="code-actions"><button type="button" class="copy-code-btn">복사</button><button type="button" class="preview-code-btn" data-code-language="' + esc(label) + '">▶ 프리뷰에서 실행</button></div></div><pre><code data-language="' + esc(label) + '">' + esc(cleanCode) + '</code></pre></div>';
      const token = '\u0000CODE' + codeBlocks.length + '\u0000';
      codeBlocks.push(html); return token;
    });
    src = esc(src);
    const inlineCode = [];
    const inline = s => s
      .replace(/``([^\n]+?)``/g, (_, code) => { const token = '\u0000INLINE' + inlineCode.length + '\u0000'; inlineCode.push(code); return token; })
      .replace(/`([^`\n]+)`/g, (_, code) => { const token = '\u0000INLINE' + inlineCode.length + '\u0000'; inlineCode.push(code); return token; })
      .replace(/[*][*]([\s\S]+?)[*][*]/g, '<strong>$1</strong>')
      .replace(/__([\s\S]+?)__/g, '<strong>$1</strong>')
      .replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>')
      .replace(/(^|[^_])_([^_\n]+)_(?!_)/g, '$1<em>$2</em>');
    const lines = src.split('\n');
    const out = [];
    let para = [], listType = null, listItems = [], quote = [];
    const flushPara = () => { if (para.length) { out.push('<p>' + inline(para.join('\n')).replace(/\n/g, '<br>') + '</p>'); para = []; } };
    const flushList = () => { if (listType) { out.push('<' + listType + '>' + listItems.map(x => '<li>' + inline(x) + '</li>').join('') + '</' + listType + '>'); listType = null; listItems = []; } };
    const flushQuote = () => { if (quote.length) { out.push('<blockquote>' + quote.map(x => '<p>' + inline(x) + '</p>').join('') + '</blockquote>'); quote = []; } };
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      const tokenMatch = line.match(/^\u0000CODE\d+\u0000$/);
      const heading = line.match(/^(#{1,3})\s+(.+)$/);
      const ul = line.match(/^\s*[-*+]\s+(.+)$/);
      const ol = line.match(/^\s*\d+[.)]\s+(.+)$/);
      const q = line.match(/^\s*&gt;\s?(.*)$/);
      if (tokenMatch || heading || ul || ol || q || !line.trim()) {
        flushPara();
        if (!ul && !ol) flushList();
        if (!q) flushQuote();
        if (tokenMatch) out.push(line);
        else if (heading) out.push('<h' + heading[1].length + '>' + inline(heading[2]) + '</h' + heading[1].length + '>');
        else if (ul || ol) { const type = ul ? 'ul' : 'ol'; if (listType && listType !== type) flushList(); listType = type; listItems.push((ul || ol)[1]); }
        else if (q) quote.push(q[1]);
      } else { flushList(); flushQuote(); para.push(line); }
    }
    flushPara(); flushList(); flushQuote();
    let result = out.join('');
    result = result.replace(/\u0000INLINE(\d+)\u0000/g, (_, n) => {
      const code = inlineCode[Number(n)] || '';
      return '<span class="inline-code-wrap"><code>' + esc(code) + '</code><button type="button" class="inline-copy" title="코드 복사" aria-label="코드 복사">복사</button></span>';
    });
    result = result.replace(/\u0000CODE(\d+)\u0000/g, (_, n) => codeBlocks[Number(n)] || '');
    return result;
  }

  // Copy code from fenced blocks and inline `code`.
  $('chat').addEventListener('click', async e => {
    const copyButton = e.target.closest('.copy-code-btn, .inline-copy');
    if (copyButton) {
      const card = copyButton.closest('.code-card');
      const inlineWrap = copyButton.closest('.inline-code-wrap');
      const code = card ? (card.querySelector('pre code')?.textContent || '') :
        (inlineWrap?.querySelector('code')?.textContent || '');
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(code);
        } else {
          const temp = document.createElement('textarea');
          temp.value = code; temp.style.position = 'fixed'; temp.style.opacity = '0';
          document.body.appendChild(temp); temp.select();
          const ok = document.execCommand('copy'); temp.remove();
          if (!ok) throw new Error('copy failed');
        }
        const previous = copyButton.textContent;
        copyButton.textContent = '복사됨 ✓';
        setTimeout(() => { if (copyButton.isConnected) copyButton.textContent = previous; }, 1200);
      } catch (_) {
        copyButton.textContent = '복사 실패';
      }
      return;
    }
    const button = e.target.closest('.preview-code-btn');
    if (!button) return;
    const code = button.closest('.code-card')?.querySelector('pre code')?.textContent || '';
    const language = (button.dataset.codeLanguage || '').toLowerCase();
    openPreview(code, language);
  });
  $('closePreview').addEventListener('click', () => $('previewPane').classList.remove('open'));
  $('runPreview').addEventListener('click', () => { $('previewFrame').srcdoc = $('previewEditor').value; });
  function openPreview(code, language) {
    let html = code;
    if (language === 'css') {
      html = '<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>' + code + '</style></head><body style="font:15px system-ui;padding:24px"><h2>CSS 프리뷰</h2><p>CSS를 HTML 문서에 적용한 결과입니다.</p><button>버튼 예시</button></body></html>';
    } else if (['js','javascript'].includes(language)) {
      html = '<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body style="font:15px system-ui;padding:20px"><h2>JavaScript 프리뷰</h2><div id="app"></div>' + '<scr' + 'ipt>\n' + code.replace(/<\x2fscript/gi, '<\\x2fscript') + '\n</scr' + 'ipt></body></html>';
    } else if (!/<\s*(?:!doctype|html|head|body|main|div|section|article|button|style|script|h[1-6])\b/i.test(code)) {
      html = '<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body style="font:15px system-ui;padding:20px">' + code + '</body></html>';
    }
    $('previewEditor').value = html;
    $('previewPane').classList.add('open');
    $('previewFrame').srcdoc = html;
  }

  function setStatus(message, error=false) {
    $('keyStatus').textContent = message;
    $('keyStatus').className = 'status' + (error ? ' error' : '');
  }
  function addMessage(role, text, id) {
    const welcome = $('welcome'); if (welcome) welcome.remove();
    const row = document.createElement('div');
    row.className = 'msg ' + (role === 'user' ? 'user' : 'assistant');
    if (id) row.id = id;
    const avatar = document.createElement('div'); avatar.className = 'avatar'; avatar.textContent = role === 'user' ? '나' : '✦';
    const bubble = document.createElement('div'); bubble.className = 'bubble'; if (role === 'assistant') bubble.innerHTML = renderMarkdown(text); else bubble.textContent = text;
    row.append(avatar, bubble); $('chat').appendChild(row); $('chat').scrollTop = $('chat').scrollHeight;
    return bubble;
  }
  async function sendMessage() {
    if (busy) return;
    const text = $('prompt').value.trim();
    if (!text) return;
    const roomForRequest = currentRoom();
    if (!me?.user) return;
    const model = roomForRequest?.model || $('model').value;
    if (roomForRequest) roomForRequest.model = model;
    localStorage.setItem(MODEL_STORE, model);
    $('prompt').value = ''; $('prompt').style.height = 'auto'; $('send').classList.remove('ready');
    addMessage('user', text);
    saveRoomMessage('user', text);
    history.push({ role: 'user', parts: [{ text }] });
    busy = true; stopped = false; abortCtl = new AbortController();
    $('send').classList.add('busy'); $('send').setAttribute('aria-label', '답장 중지');
    const answerBubble = addMessage('assistant', '');
    answerBubble.innerHTML = '<p class="slow">생각 중…</p>';
    let answer = '', raf = 0;
    const slowTimer = setTimeout(() => { if (!answer) answerBubble.innerHTML = '<p class="slow">생각 중… <b>답장이 느립니다.</b> 조금 더 기다리거나 ■ 버튼으로 중지하세요.</p>'; }, 4000);
    try {
      const post = nt => fetch('/api/chat', { method: 'POST', signal: abortCtl.signal, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ model, contents: history.slice(-30), temperature: Number($('temperature').value), noThink: nt }) });
      const fast = /flash/.test(model) && !noThink.has(model);
      let response = await post(fast);
      if (!response.ok && fast && response.status === 400) { noThink.add(model); response = await post(false); }
      if (response.status === 401) { location.reload(); return; }
      const usedHdr = response.headers.get('X-Used');
      if (usedHdr !== null && me && !me.admin) { me.used = Number(usedHdr); renderMe(); }
      if (!response.ok) {
        let detail = `HTTP ${response.status}`;
        try { const errData = await response.json(); detail = errData?.error?.message || detail; } catch (_) {}
        throw new Error(detail);
      }
      if (!response.body) throw new Error('이 브라우저에서 스트리밍 응답을 읽을 수 없습니다. 최신 Chrome 또는 Edge를 사용하세요.');
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      const appendChunk = (chunk) => {
        const parts = chunk?.candidates?.flatMap(c => c.content?.parts || []) || [];
        const piece = parts.map(p => p.text || '').join('');
        if (piece) {
          answer += piece;
          if (!raf) raf = requestAnimationFrame(() => { raf = 0; answerBubble.innerHTML = renderMarkdown(answer); $('chat').scrollTop = $('chat').scrollHeight; });
        }
      };
      while (true) {
        const { value, done } = await reader.read();
        buffer += decoder.decode(value || new Uint8Array(), { stream: !done });
        const lines = buffer.split(/\r?\n/);
        buffer = lines.pop() || '';
        for (const line of lines) {
          if (!line.startsWith('data:')) continue;
          const payload = line.slice(5).trim();
          if (!payload || payload === '[DONE]') continue;
          try { appendChunk(JSON.parse(payload)); } catch (_) { }
        }
        if (done) break;
      }
      if (buffer.startsWith('data:')) {
        const payload = buffer.slice(5).trim();
        if (payload && payload !== '[DONE]') {
          try { appendChunk(JSON.parse(payload)); } catch (_) {}
        }
      }
      cancelAnimationFrame(raf); answer = answer.trim();
      if (!answer) throw new Error('응답 텍스트가 없습니다. 모델명, API 할당량 또는 안전 필터 상태를 확인하세요.');
      answerBubble.innerHTML = renderMarkdown(answer);
      saveRoomMessage('assistant', answer);
      history.push({ role: 'model', parts: [{ text: answer }] });
      $('chat').scrollTop = $('chat').scrollHeight;
    } catch (err) {
      cancelAnimationFrame(raf);
      const part = answer.trim();
      if (stopped && part) {
        answerBubble.innerHTML = renderMarkdown(part) + '<p class="slow" style="animation:none;margin-top:8px">■ 답장을 중지했습니다</p>';
        saveRoomMessage('assistant', part);
        history.push({ role: 'model', parts: [{ text: part }] });
        return;
      }
      if (stopped) {
        answerBubble.innerHTML = '<p class="slow" style="animation:none">■ 답장을 중지했습니다</p>';
        $('prompt').value = text; $('send').classList.add('ready');
      } else {
        answerBubble.textContent = '요청 실패: ' + (err instanceof TypeError ? NO_SERVER : (err.message || String(err)));
        answerBubble.parentElement.querySelector('.avatar').textContent = '!';
        answerBubble.parentElement.querySelector('.avatar').style.color = '#ffaaa7';
      }
      // Remove the unanswered user turn from API history so a retry doesn't duplicate it.
      history.pop();
      const room = currentRoom();
      if (room && room.messages.length && room.messages[room.messages.length - 1].role === 'user' && room.messages[room.messages.length - 1].text === text) { room.messages.pop(); saveRooms(); renderRoomList(); }
    } finally {
      clearTimeout(slowTimer); abortCtl = null; busy = false; $('send').classList.remove('busy'); $('send').setAttribute('aria-label', '전송'); $('prompt').focus();
    }
  }
  boot();
})();
</script>
